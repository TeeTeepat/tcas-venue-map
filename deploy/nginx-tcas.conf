# tcas.teerapatk.com - static Next.js export, published via Cloudflare Tunnel (localhost only)
server {
    listen 127.0.0.1:8090;
    server_name tcas.teerapatk.com;
    root /var/www/tcas;
    index index.html;

    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    # Module workers must be served as JavaScript or browsers refuse to run them.
    location ~* \.m?js$ {
        types { }
        default_type text/javascript;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }
    location ~* \.(jpg|png|svg|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "public, max-age=0, must-revalidate";
        try_files $uri $uri/index.html $uri.html =404;
    }
    error_page 404 /404.html;

    gzip on;
    gzip_static on;  # serve pre-compressed .gz written by scripts/deploy-vps.sh
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml text/plain text/x-component;
    gzip_comp_level 6;
    gzip_vary on;
}
